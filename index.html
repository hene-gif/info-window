<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>讯息窗</title>
  <meta name="description" content="个人新闻摘要。最新一期、按日期翻阅、栏目筛选、全文检索和收藏。">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#efe6d6">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#efe6d6">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141614">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="讯息窗">
  <!-- 资源一律用相对路径，以便挂在 /info-window/ 下。 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#main">跳到内容</a>
  <div class="shell">
    <header class="top">
      <a class="brand" href="#/">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="7" fill="currentColor"/>
          <rect x="7" y="6" width="18" height="20" rx="2" fill="#f4efe6"/>
          <rect x="7" y="6" width="18" height="4.5" fill="currentColor"/>
          <rect x="15.2" y="11" width="1.6" height="13" fill="currentColor"/>
          <rect x="8.2" y="16.6" width="15.6" height="1.6" fill="currentColor"/>
          <rect x="17" y="18.6" width="6.2" height="6.2" rx="1" fill="#9c2f24"/>
        </svg>
        <span class="brand-name">讯息窗</span>
      </a>
      <p class="clock"><span class="clock-label">台北时间</span> <time id="clock">--:--</time></p>
      <p id="offline" class="offline" hidden>离线阅读</p>
    </header>
    <main id="main" tabindex="-1">
      <p class="status">正在打开…</p>
    </main>
  </div>
  <nav class="tabbar" aria-label="主导航">
    <a href="#/" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 8.5h16M12 8.5V20M4 14.2h16"/></svg>
      <span>本期</span>
    </a>
    <a href="#/dates" data-tab="dates">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3.5v3M16 3.5v3M4 9.5h16"/></svg>
      <span>日期</span>
    </a>
    <a href="#/search" data-tab="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M15.5 15.5 20 20"/></svg>
      <span>检索</span>
    </a>
    <a href="#/favorites" data-tab="favorites">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5h10a1 1 0 0 1 1 1V20l-6-3.2L6 20V5.5a1 1 0 0 1 1-1z"/></svg>
      <span>收藏</span>
      <em id="fav-count" hidden>0</em>
    </a>
  </nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>
    <p class="status">讯息窗需要 JavaScript 才能阅读摘要。</p>
  </noscript>
  <script src="js/app.js"></script>
</body>
</html>
