<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>讯息窗</title>
  <meta name="description" content="个人新闻摘要。最新一期、专栏、时间线、按日期翻阅、检索和收藏。">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0c0e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="讯息窗">
  <!-- 资源一律用相对路径，以便挂在 /info-window/ 下。 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#main">跳到内容</a>
  <header class="bar" id="bar">
    <div class="bar-in">
      <div class="bar-top" id="bar-top">
        <a class="brand" href="#/" aria-label="讯息窗，回到最新一期">
          <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
            <rect width="24" height="24" rx="6.5" class="mark-tile"/>
            <rect x="5.5" y="5.5" width="5.6" height="5.6" rx="1.3" class="mark-pane"/>
            <rect x="12.9" y="5.5" width="5.6" height="5.6" rx="1.3" class="mark-lit"/>
            <rect x="5.5" y="12.9" width="5.6" height="5.6" rx="1.3" class="mark-pane"/>
            <rect x="12.9" y="12.9" width="5.6" height="5.6" rx="1.3" class="mark-pane"/>
          </svg>
          <span class="brand-name">讯息窗</span>
        </a>
        <button type="button" class="picker" id="picker" aria-expanded="false" aria-controls="menu">
          <span class="picker-label" id="picker-label">讯息窗</span>
          <svg class="picker-chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.75 6 7.75l3-3"/></svg>
        </button>
        <span class="offline" id="offline" hidden>离线</span>
        <nav class="tools" aria-label="研究、专栏、时间线、检索和收藏">
          <a class="tool tool-label" href="research/">研究</a>
          <a class="tool tool-label" href="#/columns" data-tool="columns">专栏</a>
          <a class="tool tool-label" href="#/timeline" data-tool="timeline">时间线</a>
          <a class="tool" href="#/search" data-tool="search" aria-label="检索">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.75" cy="10.75" r="6.25"/><path d="m15.5 15.5 4.25 4.25"/></svg>
          </a>
          <a class="tool" href="#/favorites" data-tool="favorites" aria-label="收藏">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.25 4.25h9.5a1 1 0 0 1 1 1v14.2a.4.4 0 0 1-.63.33L12 16.6l-5.12 3.18a.4.4 0 0 1-.63-.33V5.25a1 1 0 0 1 1-1z"/></svg>
            <em id="fav-count" hidden>0</em>
          </a>
        </nav>
      </div>
      <form class="bar-search" id="bar-search" role="search" hidden>
        <label class="field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.75" cy="10.75" r="6.25"/><path d="m15.5 15.5 4.25 4.25"/></svg>
          <span class="sr-only">检索全部期次</span>
          <input id="q" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false" placeholder="标题、摘要、来源、编号">
        </label>
        <a class="cancel" href="#/" id="cancel">取消</a>
      </form>
      <div class="bar-sub" id="bar-sub">
        <div class="tabs" id="tabs" role="group" aria-label="栏目"></div>
        <label class="jump" id="jump" hidden>
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.25" y="4.25" width="13.5" height="12.5" rx="2.25"/><path d="M3.25 8.25h13.5M7 2.75v3M13 2.75v3"/></svg>
          <span>跳到日期</span>
          <input type="date" id="jump-date" aria-label="跳到日期">
        </label>
        <p class="clock" aria-label="台北时间"><span>台北</span><time id="clock">--:--</time></p>
      </div>
      <div class="blocks" id="blocks" role="group" aria-label="我关注的子块" hidden></div>
    </div>
    <div class="menu" id="menu" hidden></div>
  </header>
  <div class="scrim" id="scrim" hidden></div>
  <main id="main" tabindex="-1">
    <p class="status">正在打开…</p>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>
    <p class="status">讯息窗需要 JavaScript 才能阅读摘要。</p>
  </noscript>
  <script src="js/app.js"></script>
</body>
</html>
