name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check data files
        run: python3 scripts/check_data.py

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Test the edge-dock geometry
        run: gcc -std=c11 -Wall -Wextra -o /tmp/test-float float/test_logic.c && /tmp/test-float

      - name: Build the float helper
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc -std=c11 -Wall -Wextra -O2 -s -mwindows -o /tmp/info-window-float.exe float/main.c

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -a css js icons data _site/
          cp -a research _site/

      - name: Stamp the service worker
        run: python3 scripts/stamp_sw.py _site

      - name: Add the float helper
        run: |
          mkdir -p _site/float
          cp /tmp/info-window-float.exe _site/float/info-window-float.exe

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
